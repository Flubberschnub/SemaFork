name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode verify > maven.log 2>&1
      - name: Upload Maven log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-log
          path: maven.log
      - name: Fail when verification failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
