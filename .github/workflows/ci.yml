name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        shell: bash
        run: |
          chmod +x mvnw
          if ! ./mvnw --batch-mode verify > maven.log 2>&1; then
            tail -n 140 maven.log
            exit 1
          fi
          tail -n 40 maven.log
