name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend and PostgreSQL migrations
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: target/surefire-reports/
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check browser JavaScript syntax
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/maps.js
          node --check src/main/resources/static/place-view.js
      - name: Browser regressions (mocked Google SDK and party API)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Upload browser screenshots (test doubles, not live Google)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots
          path: test-results/
          retention-days: 7
